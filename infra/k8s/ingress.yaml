apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: digital-mirror-ingress
  namespace: digital-mirror
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - digitalmirror.app
    - api.digitalmirror.app
    secretName: digital-mirror-tls
  rules:
  # Frontend
  - host: digitalmirror.app
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 3000
  
  # Backend API
  - host: api.digitalmirror.app
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8000

