version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: digital-mirror-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digital_mirror
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - digital-mirror-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: digital-mirror-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - digital-mirror-network

  # FastAPI Backend
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: digital-mirror-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/digital_mirror
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-development-secret-key-change-in-production}
      CORS_ORIGINS: http://localhost:3000,http://localhost:19006
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
    networks:
      - digital-mirror-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # React Frontend (Web)
  frontend-web:
    build:
      context: ../frontend/web
      dockerfile: Dockerfile
    container_name: digital-mirror-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - digital-mirror-network

  # PgAdmin (Optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: digital-mirror-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@digitalmirror.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - digital-mirror-network
    profiles:
      - tools

networks:
  digital-mirror-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

